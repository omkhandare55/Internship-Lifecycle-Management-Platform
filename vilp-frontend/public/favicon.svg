  <path d="M 49 65 L 56 74 L 58 84" fill="none" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 45 65 L 40 76 L 35 88" fill="none" stroke="#0284C7" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

