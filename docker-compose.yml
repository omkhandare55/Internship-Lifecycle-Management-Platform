services:
  # ─── PostgreSQL Database ────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: vilp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vilpdb
      POSTGRES_USER: vilpuser
      POSTGRES_PASSWORD: vilppassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vilpuser -d vilpdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Mailhog — Local SMTP catcher (dev only) ───────────────────────────
  # Access web UI at http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: vilp-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

  # ─── n8n Workflow Automation Engine ─────────────────────────────────────
  # Access web UI at http://localhost:5678
  n8n:
    image: n8nio/n8n:latest
    container_name: vilp-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=false
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=Asia/Kolkata
    volumes:
      - n8n_data:/home/node/.n8n

  # ─── Spring Boot Backend ────────────────────────────────────────────────
  backend:
    build:
      context: ./vilp-backend
      dockerfile: Dockerfile
    container_name: vilp-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/vilpdb
      DATABASE_USERNAME: vilpuser
      DATABASE_PASSWORD: vilppassword
      JWT_SECRET: ${JWT_SECRET:-d9b6c4e1a8f27305e6b4c3a2f19876543210fedcba9876543210abcdef012345}
      JWT_ACCESS_EXPIRY_MS: 1800000
      JWT_REFRESH_EXPIRY_MS: 604800000
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-vilp-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-vilp-google-client-secret}
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/vilp-events
      FRONTEND_URL: http://localhost:5173
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── React Frontend ─────────────────────────────────────────────────────
  frontend:
    build:
      context: ./vilp-frontend
      dockerfile: Dockerfile
    container_name: vilp-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
    driver: local
  n8n_data:
    driver: local
