name: vilp_mobile
description: "Verified Internship Lifecycle Platform (VILP) - Official Flutter Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Networking & HTTP
  dio: ^5.4.3+1
  http: ^1.2.1

  # Secure Storage & Session
  flutter_secure_storage: ^9.0.0
  shared_preferences: ^2.2.3

  # UI, Icons, Typography & Shapes
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0

  # Native & Hardware capabilities
  file_picker: ^8.0.0+1
  url_launcher: ^6.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
