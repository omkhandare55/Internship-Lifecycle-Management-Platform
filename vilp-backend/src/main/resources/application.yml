spring:
  application:
    name: vilp-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vilpdb}
    username: ${DATABASE_USERNAME:vilpuser}
    password: ${DATABASE_PASSWORD:vilppassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema — JPA must NOT auto-create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: false
    out-of-order: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
        from: ${MAIL_FROM:noreply@vilp.edu}

  # Google OAuth is handled entirely by Supabase JS client on the frontend.
  # Spring Security OAuth2 client config is not used and has been removed
  # to avoid loading unnecessary auto-configuration beans.

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:change-this-to-a-secure-random-256-bit-base64-key-in-production}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:1800000}     # 30 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days
  issuer: vilp-platform

# App configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:vilp-documents}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
  groq:
    api-key: ${GROQ_API_KEY:}
    model: ${GROQ_MODEL:llama-3.3-70b-versatile}

# Actuator / Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    mail:
      enabled: false

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  info:
    title: VILP API
    version: 1.0.0
    description: Verified Internship Lifecycle Platform REST API

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.vilp: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
