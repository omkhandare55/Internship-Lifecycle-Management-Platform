spring:
  application:
    name: vilp-backend

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vilpdb}
    username: ${DATABASE_USERNAME:vilpuser}
    password: ${DATABASE_PASSWORD:vilppassword}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate          # Flyway manages schema — JPA must NOT auto-create
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:vilp-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:vilp-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "${FRONTEND_URL:http://localhost:5173}/auth/google/callback"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:change-this-to-a-secure-random-256-bit-base64-key-in-production}
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:1800000}     # 30 minutes
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}  # 7 days
  issuer: vilp-platform

# App configuration
app:
  frontend-url: ${FRONTEND_URL:http://localhost:5173}
  cors-allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  supabase:
    url: ${SUPABASE_URL:}
    anon-key: ${SUPABASE_ANON_KEY:}
    service-role-key: ${SUPABASE_SERVICE_ROLE_KEY:}
    storage-bucket: ${SUPABASE_STORAGE_BUCKET:vilp-documents}

# Swagger / OpenAPI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  info:
    title: VILP API
    version: 1.0.0
    description: Verified Internship Lifecycle Platform REST API

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.vilp: DEBUG
    org.springframework.security: INFO
    org.flywaydb: INFO
