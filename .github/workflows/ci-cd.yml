name: VILP CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── Job 1: Backend Quality & Build ──────────────────────────────────────
  backend-build:
    name: Backend Test & Build (Spring Boot 3.3.5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (Skip Tests for Fast CI)
        run: |
          cd vilp-backend
          mvn clean compile -DskipTests

  # ─── Job 2: Frontend Quality & Bundle ────────────────────────────────────
  frontend-build:
    name: Frontend Quality & Bundle (React 18 + TS + Vite)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: vilp-frontend/package.json

      - name: Install Dependencies
        run: |
          cd vilp-frontend
          npm ci

      - name: TypeScript Type Check
        run: |
          cd vilp-frontend
          npx tsc --noEmit

      - name: Production Bundle Build
        run: |
          cd vilp-frontend
          npm run build

  # ─── Job 3: Docker Container Build Check ─────────────────────────────────
  docker-build:
    name: Docker Container Validation
    needs: [backend-build, frontend-build]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./vilp-backend
          file: ./vilp-backend/Dockerfile
          push: false
          tags: vilp-backend:latest

      - name: Build Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./vilp-frontend
          file: ./vilp-frontend/Dockerfile
          push: false
          tags: vilp-frontend:latest
